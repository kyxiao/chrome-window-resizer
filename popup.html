<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Window Resizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #222;
      background: #f7f8fa;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .preset-btn {
      padding: 8px 6px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      color: #333;
      transition: all .15s;
      line-height: 1.4;
    }
    .preset-btn:hover { background: #eef2f7; border-color: #9aa7b4; }
    .preset-btn.active { background: #dbeafe; border-color: #3b82f6; color: #1e40af; font-weight: 600; }
    .preset-btn .label { display: block; font-weight: 600; }
    .preset-btn .size { display: block; color: #666; font-size: 11px; }
    .preset-btn.active .size { color: #1e40af; }
    .custom-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }
    .custom-row label { color: #555; white-space: nowrap; }
    .custom-row input {
      width: 64px;
      padding: 6px 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .custom-row input:focus { border-color: #3b82f6; }
    .custom-row span { color: #888; }
    .apply-btn {
      width: 100%;
      padding: 9px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .apply-btn:hover { background: #2563eb; }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #2da44e;
      min-height: 18px;
      text-align: center;
    }
    .current {
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid #e5e9ef;
      border-radius: 6px;
      font-size: 12px;
      color: #555;
      display: flex;
      justify-content: space-between;
    }
    .current strong { color: #1e40af; }
    hr { border: none; border-top: 1px solid #e5e9ef; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Window Resizer</h1>

  <div class="current">
    <span>当前窗口</span>
    <strong id="currentSize">-- x --</strong>
  </div>

  <div class="presets" id="presets"></div>

  <hr>

  <div class="custom-row">
    <label>自定义</label>
    <input type="number" id="customWidth" placeholder="宽" min="200" max="5000">
    <span>x</span>
    <input type="number" id="customHeight" placeholder="高" min="200" max="5000">
  </div>

  <button class="apply-btn" id="applyBtn">应用尺寸</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
